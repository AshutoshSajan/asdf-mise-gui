<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">asdf GUI</title>
  <desc id="desc">A native desktop console for the asdf version manager. Every version. One window.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0E0C"/>
      <stop offset="0.6" stop-color="#0B100D"/>
      <stop offset="1" stop-color="#0E1511"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 40) rotate(132) scale(620 480)">
      <stop stop-color="#B9F28C" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#7BC46A" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#7BC46A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(380 430) rotate(-90) scale(440 300)">
      <stop stop-color="#6E9E55" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#6E9E55" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#E9EFEA" stroke-opacity="0.035"/>
    </pattern>
    <linearGradient id="panel" x1="680" y1="44" x2="1216" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#131A16"/>
      <stop offset="1" stop-color="#0D1310"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#B9F28C"/>
      <stop offset="1" stop-color="#6E9E55"/>
    </linearGradient>
    <filter id="panelShadow" x="640" y="10" width="616" height="424" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="logoShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#B9F28C" flood-opacity="0.16"/>
    </filter>
    <clipPath id="panelClip">
      <rect x="680" y="48" width="536" height="344" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1280" height="440" rx="26" fill="url(#background)"/>
  <rect width="1280" height="440" rx="26" fill="url(#glow)"/>
  <rect width="1280" height="440" rx="26" fill="url(#warm)"/>
  <rect width="1280" height="440" rx="26" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="438.5" rx="25.25" stroke="#28332C" stroke-width="1.5"/>

  <!-- Brand -->
  <g filter="url(#logoShadow)">
    <rect x="64" y="54" width="46" height="46" rx="12" fill="#141917"/>
    <rect x="64.75" y="54.75" width="44.5" height="44.5" rx="11.25" stroke="#2A362F" stroke-width="1.5"/>
    <path d="M76 69.5L83.5 77L76 84.5" stroke="#B9F28C" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M86.5 85H97" stroke="#E9EFEA" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="98" cy="67.5" r="2.6" fill="#B9F28C"/>
  </g>
  <text x="126" y="86" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="-0.8" fill="#E9EFEA">asdf</text>
  <rect x="194" y="62" width="41" height="21" rx="5" fill="#1A211D"/>
  <text x="203" y="77" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#96A39A">GUI</text>

  <!-- Eyebrow -->
  <text x="65" y="148" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="3.2" fill="#96A39A">NATIVE DESKTOP CONSOLE FOR ASDF</text>

  <!-- Headline -->
  <text x="64" y="217" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="57" font-weight="700" letter-spacing="-2.8" fill="#F2F7F3">Every version.</text>
  <text x="64" y="277" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="57" font-weight="700" letter-spacing="-2.8" fill="#B9F28C">One window.</text>

  <!-- Supporting copy -->
  <text x="65" y="315" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#96A39A">Install toolchains, pin project versions, and watch every</text>
  <text x="65" y="337" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14.5" fill="#96A39A">asdf operation stream by line — without leaving the app.</text>

  <!-- Pills -->
  <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="500">
    <rect x="65" y="364" width="108" height="28" rx="14" fill="#121815" stroke="#28332C"/>
    <circle cx="81" cy="378" r="2.5" fill="#B9F28C"/>
    <text x="91" y="382" fill="#C7D2CA">asdf-native</text>

    <rect x="181" y="364" width="122" height="28" rx="14" fill="#121815" stroke="#28332C"/>
    <circle cx="197" cy="378" r="2.5" fill="#93BDF5"/>
    <text x="207" y="382" fill="#C7D2CA">streamed logs</text>

    <rect x="311" y="364" width="138" height="28" rx="14" fill="#121815" stroke="#28332C"/>
    <circle cx="327" cy="378" r="2.5" fill="#F1C66D"/>
    <text x="337" y="382" fill="#C7D2CA">serialized queue</text>

    <rect x="457" y="364" width="130" height="28" rx="14" fill="#121815" stroke="#28332C"/>
    <circle cx="473" cy="378" r="2.5" fill="#B9F28C"/>
    <text x="483" y="382" fill="#C7D2CA">macOS + Linux</text>
  </g>

  <!-- App preview -->
  <g filter="url(#panelShadow)">
    <rect x="680" y="48" width="536" height="344" rx="14" fill="url(#panel)" stroke="#2B3830" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#panelClip)">
    <rect x="680" y="48" width="536" height="38" fill="#0F1512"/>
    <line x1="680" y1="86" x2="1216" y2="86" stroke="#222D26"/>
    <circle cx="700" cy="67" r="4.5" fill="#F3928A"/>
    <circle cx="715" cy="67" r="4.5" fill="#F1C66D"/>
    <circle cx="730" cy="67" r="4.5" fill="#B9F28C"/>
    <text x="948" y="71" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9.5" fill="#6A766E">asdf-gui / dashboard</text>

    <!-- Sidebar -->
    <rect x="680" y="86" width="128" height="306" fill="#0C110E"/>
    <line x1="808" y1="86" x2="808" y2="392" stroke="#222D26"/>
    <rect x="690" y="100" width="108" height="26" rx="6" fill="#1A211D"/>
    <rect x="690" y="100" width="2" height="26" rx="1" fill="#B9F28C"/>
    <rect x="702" y="109" width="8" height="8" rx="2" fill="#B9F28C" opacity="0.8"/>
    <text x="718" y="117" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#E9EFEA">Dashboard</text>

    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="500" fill="#96A39A">
      <rect x="702" y="137" width="8" height="8" rx="2" stroke="#6A766E"/>
      <text x="718" y="145">Tools</text>
      <rect x="702" y="164" width="8" height="8" rx="2" stroke="#6A766E"/>
      <text x="718" y="172">Plugins</text>
      <rect x="702" y="191" width="8" height="8" rx="2" stroke="#6A766E"/>
      <text x="718" y="199">Project</text>
      <rect x="702" y="218" width="8" height="8" rx="2" stroke="#6A766E"/>
      <text x="718" y="226">Operations</text>
      <rect x="702" y="245" width="8" height="8" rx="2" stroke="#6A766E"/>
      <text x="718" y="253">Settings</text>
    </g>

    <rect x="690" y="330" width="108" height="46" rx="7" fill="#101613" stroke="#222D26"/>
    <text x="700" y="345" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="7.5" letter-spacing="0.8" fill="#6A766E">ENGINE</text>
    <circle cx="787" cy="342" r="3" fill="#B9F28C"/>
    <text x="700" y="361" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9" fill="#C7D2CA">v0.20.2</text>
    <text x="700" y="370" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="7.5" fill="#6A766E">~/.asdf</text>

    <!-- Main: project card -->
    <text x="826" y="110" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#E9EFEA">Active project</text>
    <text x="1176" y="110" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="8.5" fill="#6A766E">~/work/atlas</text>
    <rect x="826" y="122" width="372" height="90" rx="8" fill="#111714" stroke="#242F28"/>
    <line x1="826" y1="152" x2="1198" y2="152" stroke="#1E2822"/>
    <line x1="826" y1="182" x2="1198" y2="182" stroke="#1E2822"/>
    <text x="840" y="142" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9.5" fill="#E9EFEA">nodejs</text>
    <text x="900" y="142" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="8.5" fill="#96A39A">22.0.0</text>
    <rect x="1138" y="132" width="46" height="15" rx="7.5" fill="#B9F28C" fill-opacity="0.12" stroke="#B9F28C" stroke-opacity="0.25"/>
    <text x="1161" y="142.5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#B9F28C">active</text>

    <text x="840" y="172" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9.5" fill="#E9EFEA">python</text>
    <text x="900" y="172" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="8.5" fill="#96A39A">3.12.2</text>
    <rect x="1138" y="162" width="46" height="15" rx="7.5" fill="#F3928A" fill-opacity="0.1" stroke="#F3928A" stroke-opacity="0.25"/>
    <text x="1161" y="172.5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#F3928A">missing</text>

    <text x="840" y="202" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="9.5" fill="#E9EFEA">ruby</text>
    <text x="900" y="202" font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="8.5" fill="#96A39A">3.3.0</text>
    <rect x="1138" y="192" width="46" height="15" rx="7.5" fill="#B9F28C" fill-opacity="0.12" stroke="#B9F28C" stroke-opacity="0.25"/>
    <text x="1161" y="202.5" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#B9F28C">active</text>

    <!-- Main: operation card -->
    <text x="826" y="239" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#E9EFEA">Live operation</text>
    <rect x="1110" y="227" width="88" height="16" rx="8" fill="#93BDF5" fill-opacity="0.1" stroke="#93BDF5" stroke-opacity="0.25"/>
    <circle cx="1122" cy="235" r="2.5" fill="#93BDF5"/>
    <text x="1130" y="238.5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="7.5" font-weight="600" fill="#93BDF5">installing</text>

    <rect x="826" y="251" width="372" height="94" rx="8" fill="#080B09" stroke="#242F28"/>
    <g font-family="ui-monospace, 'SFMono-Regular', Consolas, monospace" font-size="8.5">
      <text x="840" y="268" fill="#B9F28C">$</text>
      <text x="852" y="268" fill="#C7D2CA">asdf install python 3.12.2</text>
      <text x="840" y="284" fill="#6A766E"># dir: ~/work/atlas</text>
      <text x="840" y="300" fill="#96A39A">Downloading Python 3.12.2...</text>
      <text x="840" y="316" fill="#96A39A">Compiling with 10 jobs</text>
      <rect x="840" y="327" width="256" height="3" rx="1.5" fill="#1E2822"/>
      <rect x="840" y="327" width="174" height="3" rx="1.5" fill="url(#accentBar)"/>
    </g>

    <!-- Accent corner -->
    <rect x="1186" y="370" width="12" height="2" rx="1" fill="#B9F28C"/>
    <rect x="1180" y="376" width="18" height="2" rx="1" fill="#B9F28C" opacity="0.5"/>
  </g>
</svg>
