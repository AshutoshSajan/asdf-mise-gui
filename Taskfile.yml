version: '3'

vars:
  APP_NAME: "asdf-gui"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  dev:gtk3:
    summary: Runs the app in development mode against GTK3/WebKit2GTK 4.1
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}} -tags gtk3

  build:gtk3:
    summary: Builds the Linux app against GTK3/WebKit2GTK 4.1
    cmds:
      - task: linux:build
        vars:
          EXTRA_TAGS: gtk3

  test:
    summary: Runs backend tests and type-checks/builds the frontend
    cmds:
      - go test -tags gtk3 ./internal/...
      - npm --prefix frontend run build

  audit:
    summary: Runs Go vulnerability checks and the npm security audit
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest -tags gtk3 ./internal/... .
      - npm --prefix frontend audit --audit-level=high

  deps:check:
    summary: Fails when direct Go or npm dependencies are outdated
    cmds:
      - ./scripts/check-outdated-deps.sh --strict

  deps:check:warn:
    summary: Reports outdated dependencies without failing
    cmds:
      - ./scripts/check-outdated-deps.sh --warn

  hooks:install:
    summary: Installs the repository git hooks and marks helper scripts executable
    cmds:
      - chmod +x .githooks/pre-commit .githooks/pre-push scripts/*.sh
      - git config core.hooksPath .githooks
      - git config --get core.hooksPath

  hooks:status:
    summary: Shows whether the repository git hooks are installed
    cmds:
      - 'git config --get core.hooksPath || echo "hooks are not installed; run: task hooks:install"'

  hooks:uninstall:
    summary: Restores the default git hooks directory
    cmds:
      - git config --unset core.hooksPath || true

  install:msix:tools:
    summary: Installs tools required for Windows MSIX packaging
    cmds:
      - task: windows:install:msix:tools

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
